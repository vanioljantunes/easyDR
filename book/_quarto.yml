project:
  type: book
  output-dir: _book

book:
  title: "Dose-Response Meta-Analysis"
  subtitle: "A hands-on guide"
  author: "Vanio Antunes"
  date: today
  date-format: "MMMM YYYY"
  # Served from a project Pages subpath, never a domain root.
  site-url: https://vanioljantunes.github.io/easyDR/
  search: true
  page-footer:
    left: "Dose-Response Meta-Analysis, by Vanio Antunes"
    right: "Built with Quarto"
  sidebar:
    style: docked
  chapters:
    - index.qmd
    - cite.qmd
    - 01-what-is-it.qmd
    - 02-viability.qmd
    - 03-prospero.qmd
    - 04-statistics.qmd
    - 05-checklist-writing.qmd
    - references.qmd

bibliography: references.bib
csl: https://www.zotero.org/styles/vancouver

language:
  search-text-placeholder: "Search"

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    number-sections: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    anchor-sections: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    fig-cap-location: bottom
    tbl-cap-location: top

execute:
  freeze: auto
  echo: true
  warning: false
